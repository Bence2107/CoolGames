<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../style/style.css">
    <script src="https://kit.fontawesome.com/0c6bdff3b5.js" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    <header>
        <img src="../img/header/logo.png" class="logo">
        <nav>
            <ul class="navbar">
                <li><a href="index.html">Főoldal <i class="fa-solid fa-house"></i></a></li>
                <li><a href="#">Hírek <i class="fa-solid fa-newspaper"></i></a></li>
                <li><a href="#">Játékok <i class="fa-solid fa-gamepad"></i></a></li>
                <li><a href="#">Kosár <i class="fa-solid fa-cart-shopping"></i></a></li>
                <div class="dropdown">
                    <li><a href="#" id="active">Fiók <i class="fa-solid fa-user"></i></a></li>
                    <div class="dropdown_content">
                        <a href="#">Bejelentkezés</a><br>
                        <a href="#">Regisztráció</a>
                    </div>
                </div>
                
            </ul>
        </nav>
    </header>
    <main class="inner_main">
            <div class="inner">
                <div class="content">
                    <h2>Regisztráció</h2>
                    <form>
                        <div class="input_field">
                            <input type="text" placeholder="Felhasználónév" required>
                        </div>
                        <div class="input_field">
                            <input type="email" placeholder="Email" required>
                        </div>
                        <div class="input_field">
                            <input type="password" placeholder="Jelszó" required>
                        </div>
                        <div class="input_field">
                            <input type="password" placeholder="Jelszó újra" required>
                        </div>
                        <button>Regisztráció</button>
                    </form>
                </div>
            </div>
    </main>
    <script>
        const aboutUS = document.querySelector(".content h2");
        const tableDisplay = document.querySelector(".content table");
        let clicks = 0;
        aboutUS.addEventListener("click", () => {
            if(clicks === 0){
                tableDisplay.style.display = "table";
                tableDisplay.style.animation = "fadeIn";
                tableDisplay.style.animationDuration = "2s";
                clicks++;
            }
            else{
                tableDisplay.style.animation = "fadeOut";
                tableDisplay.style.animationDuration = "1s";
                setTimeout(() => {
                    tableDisplay.style.display = "none";
                }, 900);
                clicks--;
            }
            
        }) 
    </script>
</body>
</html>
