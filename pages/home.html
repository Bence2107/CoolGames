<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../style/style.css">
    <script src="https://kit.fontawesome.com/0c6bdff3b5.js" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    <header class="header">
        <h1>Cool<span>Games</span></h1>
        <nav>
            <ul class="navbar">
                <li><a href="#" id="active">Főoldal <i class="fa-solid fa-house"></i></a></li>
                <li><a href="#">Játékok <i class="fa-solid fa-gamepad"></i></a></li>
                <li><a href="#">Kosár <i class="fa-solid fa-cart-shopping"></i></a></li>
                <li><a href="*"><button class="headerButton">Bejelentkezés</button></a></li>
            </ul>
        </nav>
    </header>
    <main class="inner_main">
            <div class="inner">
                
            </div>
    </main>
    <script>
        const aboutUS = document.querySelector(".content h2");
        const tableDisplay = document.querySelector(".content table");
        let clicks = 0;
        aboutUS.addEventListener("click", () => {
            if(clicks === 0){
                tableDisplay.style.display = "table";
                tableDisplay.style.animation = "fadeIn";
                tableDisplay.style.animationDuration = "2s";
                clicks++;
            }
            else{
                tableDisplay.style.animation = "fadeOut";
                tableDisplay.style.animationDuration = "1s";
                setTimeout(() => {
                    tableDisplay.style.display = "none";
                }, 900);
                clicks--;
            }
            
        }) 
    </script>
</body>
</html>
